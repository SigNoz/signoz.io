<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 256" width="764">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background: keeps the figure legible on the dark docs theme -->
  <rect x="0" y="0" width="764" height="256" rx="12" fill="#ffffff"/>

  <!-- Layer 1: grouping box. Kubernetes cluster: x=204, y=24, w=340, h=208, right=544, bottom=232 -->
  <rect x="204" y="24" width="340" height="208" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="214" y="38" font-size="11" fill="#64748b">Kubernetes cluster</text>

  <!-- Layer 2: connectors -->
  <!-- You/GitOps (right=174) to custom resources (left=222), y=106 -->
  <path d="M179,106 L 211,106" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- Custom resources (right=362) to operator (left=390), y=113 -->
  <path d="M367,113 L 379,113" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- ProviderConfig (right=362, center y=187) to operator bottom (172), center x=458 -->
  <path d="M367,187 C 430,187 458,205 458,183" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <!-- Operator (right=526) to SigNoz (left=600), y=136 -->
  <path d="M531,136 L 589,136" fill="none" stroke="#f59e0b" marker-end="url(#arrow-orange)"/>
  <text x="572" y="124" font-size="10" fill="#64748b" text-anchor="middle">HTTP(S)</text>

  <!-- Layer 3: boxes and text -->
  <!-- You/GitOps: x=24, y=86, w=150, h=72, center x=99 -->
  <rect x="24" y="86" width="150" height="72" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="99" y="108" font-size="12" fill="#1e293b" text-anchor="middle">You or GitOps</text>
  <text x="99" y="126" font-size="12" fill="#1e293b" text-anchor="middle">kubectl apply,</text>
  <text x="99" y="144" font-size="12" fill="#1e293b" text-anchor="middle">Argo CD, Flux</text>

  <!-- Custom resources: x=222, y=54, w=140, h=72, center x=292 -->
  <rect x="222" y="54" width="140" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="292" y="76" font-size="12" fill="#1e40af" text-anchor="middle">Custom resources</text>
  <text x="292" y="94" font-size="12" fill="#1e40af" text-anchor="middle">Dashboard, Rule,</text>
  <text x="292" y="112" font-size="12" fill="#1e40af" text-anchor="middle">User, Role, ...</text>

  <!-- ProviderConfig: x=222, y=160, w=140, h=54, center x=292 -->
  <rect x="222" y="160" width="140" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="292" y="182" font-size="12" fill="#9d174d" text-anchor="middle">ProviderConfig</text>
  <text x="292" y="200" font-size="12" fill="#9d174d" text-anchor="middle">+ Secret (API key)</text>

  <!-- Operator: x=390, y=100, w=136, h=72, center x=458 -->
  <rect x="390" y="100" width="136" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="458" y="122" font-size="12" fill="#b45309" text-anchor="middle">SigNoz Operator</text>
  <text x="458" y="140" font-size="12" fill="#b45309" text-anchor="middle">create, update,</text>
  <text x="458" y="158" font-size="12" fill="#b45309" text-anchor="middle">delete, re-check</text>

  <!-- SigNoz: x=600, y=100, w=140, h=72, center x=670 -->
  <rect x="600" y="100" width="140" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="670" y="122" font-size="12" fill="#166534" text-anchor="middle">SigNoz instance</text>
  <text x="670" y="140" font-size="12" fill="#166534" text-anchor="middle">Cloud or</text>
  <text x="670" y="158" font-size="12" fill="#166534" text-anchor="middle">self-hosted</text>
</svg>
