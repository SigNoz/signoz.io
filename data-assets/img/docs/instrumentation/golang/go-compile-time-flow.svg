<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="'Inter', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#636e72"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#fdcb6e"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#00b894"/>
    </marker>
    <linearGradient id="signoz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="glow-o" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#F97316" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse-signoz {
        0%,100% { filter: url(#glow-o); }
        50%      { filter: none; }
      }
      .signoz-box { animation: pulse-signoz 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1000" height="330" fill="url(#bgGrad)" rx="14"/>

  <text x="500" y="38" text-anchor="middle" fill="#f5f6fa" font-size="19" font-weight="700">otelc instruments the build, not the source</text>

  <!-- pipeline row: y=100 h=70 -->
  <rect x="55" y="100" width="210" height="70" rx="8" fill="#20222e" stroke="#2f3342" stroke-width="1.5"/>
  <text x="160" y="128" text-anchor="middle" fill="#dfe6e9" font-size="13">Your source code</text>
  <text x="160" y="148" text-anchor="middle" fill="#9aa3b2" font-size="11">and its dependencies</text>

  <rect x="305" y="100" width="190" height="70" rx="8" fill="#20222e" stroke="#fdcb6e" stroke-width="1.5"/>
  <text x="400" y="128" text-anchor="middle" fill="#fdcb6e" font-size="13" font-weight="600">otelc go build</text>
  <text x="400" y="148" text-anchor="middle" fill="#9aa3b2" font-size="11">wraps the Go toolchain</text>

  <rect x="535" y="100" width="230" height="70" rx="8" fill="#20222e" stroke="#2f3342" stroke-width="1.5"/>
  <text x="650" y="128" text-anchor="middle" fill="#dfe6e9" font-size="13">Instrumented binary</text>
  <text x="650" y="148" text-anchor="middle" fill="#9aa3b2" font-size="11">same command to run it</text>

  <rect x="805" y="100" width="140" height="70" rx="8" fill="url(#signoz-grad)" class="signoz-box"/>
  <text x="875" y="140" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">SigNoz</text>

  <path d="M270,135 L 294,135" fill="none" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <path d="M500,135 L 524,135" fill="none" stroke="#fdcb6e" stroke-width="1.5" marker-end="url(#arrAmber)"/>
  <path d="M770,135 L 794,135" fill="none" stroke="#00b894" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="785" y="123" text-anchor="middle" fill="#9aa3b2" font-size="10">OTLP</text>

  <!-- annotations under the row: y=210 h=54 -->
  <path d="M160,175 L 160,199" fill="none" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <path d="M400,175 L 400,199" fill="none" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <path d="M650,175 L 650,199" fill="none" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <rect x="55" y="210" width="210" height="54" rx="8" fill="#191b26" stroke="#2f3342" stroke-width="1.5"/>
  <text x="160" y="232" text-anchor="middle" fill="#9aa3b2" font-size="11">No import, no init code,</text>
  <text x="160" y="250" text-anchor="middle" fill="#9aa3b2" font-size="11">no diff in your repository</text>

  <rect x="305" y="210" width="190" height="54" rx="8" fill="#191b26" stroke="#2f3342" stroke-width="1.5"/>
  <text x="400" y="232" text-anchor="middle" fill="#9aa3b2" font-size="11">Hooks injected into</text>
  <text x="400" y="250" text-anchor="middle" fill="#9aa3b2" font-size="11">matched libraries</text>

  <rect x="535" y="210" width="230" height="54" rx="8" fill="#191b26" stroke="#2f3342" stroke-width="1.5"/>
  <text x="650" y="232" text-anchor="middle" fill="#9aa3b2" font-size="11">Traces and Go runtime metrics,</text>
  <text x="650" y="250" text-anchor="middle" fill="#9aa3b2" font-size="11">configured by OTEL_* variables</text>

  <text x="500" y="300" text-anchor="middle" fill="#9aa3b2" font-size="12">The binary needs no extra privileges, so it deploys exactly as before.</text>

  <!-- flowing build pipeline -->
  <circle r="3.5" fill="#636e72" opacity="0.9">
    <animateMotion dur="1.2s" repeatCount="indefinite" begin="0s" path="M270,135 L 292,135"/>
  </circle>
  <circle r="3.5" fill="#fdcb6e" opacity="0.9">
    <animateMotion dur="1.2s" repeatCount="indefinite" begin="0.6s" path="M500,135 L 522,135"/>
  </circle>
  <circle r="3.5" fill="#00b894" opacity="0.9">
    <animateMotion dur="1.2s" repeatCount="indefinite" begin="1.2s" path="M770,135 L 792,135"/>
  </circle>
</svg>
