<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="'Inter', 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62687C"/>
    </marker>
  </defs>

  <rect width="1200" height="880" fill="#0B0C0E"/>

  <!-- ============ connectors ============ -->
  <g stroke="#62687C" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 250 106 L 250 148"/>
    <path d="M 460 200 L 612 200"/>
    <path d="M 250 254 L 250 326"/>
    <path d="M 460 372 L 612 372"/>
    <path d="M 250 418 L 250 490"/>
    <path d="M 460 532 L 612 532"/>
    <path d="M 250 574 L 250 646"/>
    <path d="M 460 676 L 540 676 L 540 664 L 612 664"/>
    <path d="M 460 706 L 540 706 L 540 786 L 612 786"/>
  </g>

  <g font-size="15" fill="#C0C1C3">
    <text x="262" y="292">prints</text>
    <text x="262" y="456">no errors</text>
    <text x="262" y="616">via Collector</text>
    <text x="470" y="190" fill="#EA6D71">nothing prints</text>
    <text x="470" y="362" fill="#EA6D71">error shown</text>
    <text x="470" y="522" fill="#EA6D71">direct</text>
    <text x="470" y="654" fill="#EA6D71">yes</text>
    <text x="470" y="742" fill="#EA6D71">no</text>
  </g>

  <!-- ============ start ============ -->
  <g>
    <rect x="40" y="40" width="420" height="66" rx="10" fill="#121317" stroke="#25E192" stroke-width="1.5"/>
    <text x="250" y="70" text-anchor="middle" font-size="19" font-weight="600" fill="#FFFFFF">Missing data in SigNoz?</text>
    <text x="250" y="92" text-anchor="middle" font-size="15" fill="#C0C1C3">Same steps for traces, logs, and metrics.</text>
  </g>

  <!-- ============ questions ============ -->
  <g>
    <rect x="40" y="148" width="420" height="106" rx="10" fill="#121317" stroke="#4E74F8" stroke-width="1.5"/>
    <text x="250" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">1. Enable the console exporter,</text>
    <text x="250" y="205" text-anchor="middle" font-size="16" fill="#C0C1C3">restart, and exercise the code path.</text>
    <text x="250" y="230" text-anchor="middle" font-size="16" fill="#C0C1C3">Does telemetry print to your console?</text>
  </g>

  <g>
    <rect x="40" y="326" width="420" height="92" rx="10" fill="#121317" stroke="#4E74F8" stroke-width="1.5"/>
    <text x="250" y="362" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">2. Do the SDK&#8217;s debug logs</text>
    <text x="250" y="388" text-anchor="middle" font-size="16" fill="#C0C1C3">show export errors?</text>
  </g>

  <g>
    <rect x="40" y="490" width="420" height="84" rx="10" fill="#121317" stroke="#4E74F8" stroke-width="1.5"/>
    <text x="250" y="522" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">3. Sending directly to SigNoz,</text>
    <text x="250" y="548" text-anchor="middle" font-size="16" fill="#C0C1C3">or through a Collector?</text>
  </g>

  <g>
    <rect x="40" y="646" width="420" height="106" rx="10" fill="#121317" stroke="#4E74F8" stroke-width="1.5"/>
    <text x="250" y="678" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">4. Add the Collector&#8217;s debug exporter.</text>
    <text x="250" y="703" text-anchor="middle" font-size="16" fill="#C0C1C3">Does your data appear in the</text>
    <text x="250" y="728" text-anchor="middle" font-size="16" fill="#C0C1C3">Collector&#8217;s own logs?</text>
  </g>

  <!-- ============ outcomes ============ -->
  <g>
    <rect x="612" y="148" width="548" height="106" rx="10" fill="#16181D" stroke="#E5484D" stroke-width="1.5"/>
    <text x="886" y="180" text-anchor="middle" font-size="18" font-weight="600" fill="#EA6D71">Instrumentation problem</text>
    <text x="886" y="205" text-anchor="middle" font-size="15" fill="#C0C1C3">The SDK or agent is not initialized before your code,</text>
    <text x="886" y="228" text-anchor="middle" font-size="15" fill="#C0C1C3">or your runtime or a library version is unsupported.</text>
  </g>

  <g>
    <rect x="612" y="286" width="548" height="172" rx="10" fill="#16181D" stroke="#E5484D" stroke-width="1.5"/>
    <text x="886" y="316" text-anchor="middle" font-size="18" font-weight="600" fill="#EA6D71">Match the error</text>
    <g font-size="14" fill="#C0C1C3">
      <text x="636" y="345">401 / 403 &#8594; wrong or expired ingestion key</text>
      <text x="636" y="372">404 &#8594; wrong endpoint or path</text>
      <text x="636" y="399">connection refused / timeout &#8594; endpoint or Collector unreachable</text>
      <text x="636" y="426">succeeds but UI empty &#8594; wrong region (Cloud), or wrong instance</text>
    </g>
  </g>

  <g>
    <rect x="612" y="490" width="548" height="92" rx="10" fill="#16181D" stroke="#E5484D" stroke-width="1.5"/>
    <text x="886" y="520" text-anchor="middle" font-size="18" font-weight="600" fill="#EA6D71">Direct export</text>
    <text x="886" y="546" text-anchor="middle" font-size="15" fill="#C0C1C3">curl the endpoint. Connects but no data?</text>
    <text x="886" y="566" text-anchor="middle" font-size="15" fill="#C0C1C3">Check the key, endpoint, and region.</text>
  </g>

  <g>
    <rect x="612" y="612" width="548" height="92" rx="10" fill="#16181D" stroke="#E5484D" stroke-width="1.5"/>
    <text x="886" y="642" text-anchor="middle" font-size="18" font-weight="600" fill="#EA6D71">Collector &#8594; SigNoz problem</text>
    <text x="886" y="668" text-anchor="middle" font-size="15" fill="#C0C1C3">Fix the otlphttp exporter (endpoint, key, region),</text>
    <text x="886" y="688" text-anchor="middle" font-size="15" fill="#C0C1C3">and make sure it is wired into the pipeline.</text>
  </g>

  <g>
    <rect x="612" y="734" width="548" height="92" rx="10" fill="#16181D" stroke="#E5484D" stroke-width="1.5"/>
    <text x="886" y="764" text-anchor="middle" font-size="18" font-weight="600" fill="#EA6D71">App &#8594; Collector problem</text>
    <text x="886" y="790" text-anchor="middle" font-size="15" fill="#C0C1C3">Check OTEL_EXPORTER_OTLP_ENDPOINT, that the</text>
    <text x="886" y="810" text-anchor="middle" font-size="15" fill="#C0C1C3">Collector listens on 4317/4318, and firewalls.</text>
  </g>
</svg>
