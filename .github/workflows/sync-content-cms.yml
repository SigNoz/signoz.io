# Sync Content to Strapi CMS
# Triggers: On push to main, on labeled PR previews, and on PR close cleanup

name: Sync Content to Strapi CMS

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened, closed]
  push:
    branches:
      - main
    paths:
      - 'data/**/*.mdx'
      - 'data/**/*.md'
      - 'data-assets/**'
      - 'data/docs-side-nav/**'
      - 'constants/listicles/**'

env:
  SYNC_FOLDERS: '["faqs","case-study","opentelemetry","comparisons","guides","blog","docs"]'

jobs:
  sync-content:
    name: Detect Changes & Sync Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch PR Base Branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Initialize Change Output Files
        run: |
          mkdir -p .github/outputs
          echo "[]" > .github/outputs/content_changed_files.json
          echo "[]" > .github/outputs/content_restore_files.json
          echo "[]" > .github/outputs/content_deleted_files.json
          echo "[]" > .github/outputs/assets_changed_files.json
          echo "[]" > .github/outputs/listicles_changed_files.json
          echo "[]" > .github/outputs/listicles_deleted_files.json

      # Pin to SHA for supply-chain safety — do not use mutable tags
      - name: Get Changed Content Files
        id: changed-content
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: |
            data/**/*.mdx
            data/**/*.md
          json: true
          escape_json: false
          write_output_files: true

      - name: Rename Content Output Files
        if: github.event_name == 'push'
        run: |
          if [ -f .github/outputs/all_changed_files.json ]; then
            mv .github/outputs/all_changed_files.json .github/outputs/content_changed_files.json
          fi
          if [ -f .github/outputs/deleted_files.json ]; then
            mv .github/outputs/deleted_files.json .github/outputs/content_deleted_files.json
          fi

      - name: Classify PR Content Files
        id: classify-pr-content
        # Skip classifier on merged closes — live sync comes from push to main.
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action != 'closed' || github.event.pull_request.merged == false)
        run: |
          node scripts/cms-sync/pr-file-classifier.js \
            --event-action "${{ github.event.action }}" \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            --output-dir .github/outputs \
            --sync-folders "$SYNC_FOLDERS"

      - name: Get Changed Asset Files
        id: changed-assets
        if: github.event_name == 'push' || github.event.action != 'closed'
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: |
            data-assets/**
          json: true
          escape_json: false
          write_output_files: true

      - name: Rename Asset Output Files
        if: github.event_name == 'push' || github.event.action != 'closed'
        run: |
          if [ -f .github/outputs/all_changed_files.json ]; then
            mv .github/outputs/all_changed_files.json .github/outputs/assets_changed_files.json
          fi

      - name: Get Changed Sidenav Files
        id: changed-sidenav
        if: github.event_name == 'push' || github.event.action != 'closed'
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: data/docs-side-nav/**

      - name: Get Changed Listicle Files
        id: changed-listicles
        if: github.event_name == 'push' || github.event.action != 'closed'
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: constants/listicles/**/*.json
          json: true
          escape_json: false
          write_output_files: true

      - name: Rename Listicle Output Files
        if: github.event_name == 'push' || github.event.action != 'closed'
        run: |
          if [ -f .github/outputs/all_changed_files.json ]; then
            mv .github/outputs/all_changed_files.json .github/outputs/listicles_changed_files.json
          fi
          if [ -f .github/outputs/deleted_files.json ]; then
            mv .github/outputs/deleted_files.json .github/outputs/listicles_deleted_files.json
          fi

      - name: Determine Sync Status
        id: check-sync
        run: |
          LABEL_FLAG=""
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'staging') }}" == "true" ]]; then
            LABEL_FLAG="--has-staging-label"
          fi

          SAME_REPO_FLAG=""
          if [[ "${{ github.event_name }}" != "pull_request" || "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            SAME_REPO_FLAG="--same-repo"
          fi

          MERGED_FLAG=""
          if [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
            MERGED_FLAG="--merged"
          fi

          node scripts/cms-sync/determine-sync.js \
            --event-name "${{ github.event_name }}" \
            --event-action "${{ github.event.action }}" \
            --ref "${{ github.ref }}" \
            $LABEL_FLAG \
            $SAME_REPO_FLAG \
            $MERGED_FLAG \
            --any-content-changed "${{ steps.changed-content.outputs.any_changed == 'true' || steps.classify-pr-content.outputs.any_changed == 'true' }}" \
            --any-content-restored "${{ steps.classify-pr-content.outputs.any_restored == 'true' }}" \
            --any-content-deleted "${{ steps.changed-content.outputs.any_deleted == 'true' || steps.classify-pr-content.outputs.any_deleted == 'true' }}" \
            --any-assets-changed "${{ steps.changed-assets.outputs.any_changed == 'true' }}" \
            --sidenav-changed "${{ steps.changed-sidenav.outputs.any_changed == 'true' }}" \
            --any-listicles-changed "${{ steps.changed-listicles.outputs.any_changed == 'true' }}"

      - name: Install Dependencies
        if: steps.check-sync.outputs.skip != 'true'
        run: |
          yarn add --no-lockfile \
            gray-matter \
            axios \
            js-yaml \
            mime-types \
            @aws-sdk/client-s3

      - name: Set Production Environment Variables
        if: steps.check-sync.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          _CMS_URL: ${{ secrets.CMS_API_URL }}
          _CMS_TOKEN: ${{ secrets.CMS_API_TOKEN }}
          _S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
          _CDN_URL: ${{ secrets.CDN_URL }}
          _AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          _AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          _BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          _REVALIDATE: ${{ secrets.REVALIDATE_SECRET }}
          _S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          echo "DEPLOYMENT_STATUS=live" >> $GITHUB_ENV
          echo "S3_REGION=$_S3_REGION" >> $GITHUB_ENV
          echo "CMS_API_URL=$_CMS_URL" >> $GITHUB_ENV
          echo "CMS_API_TOKEN=$_CMS_TOKEN" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=$_S3_BUCKET" >> $GITHUB_ENV
          echo "CDN_URL=$_CDN_URL" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=$_AWS_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$_AWS_SECRET" >> $GITHUB_ENV
          echo "BASE_URL=$_BASE_URL" >> $GITHUB_ENV
          echo "REVALIDATE_SECRET=$_REVALIDATE" >> $GITHUB_ENV

      # Staging secrets are used only after determine-sync accepts a same-repo PR.
      # Fork PRs use trigger 'pull_request' (not pull_request_target), so secrets are empty.
      - name: Set Staging Environment Variables
        if: steps.check-sync.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          _CMS_URL: ${{ secrets.CMS_STAGING_API_URL }}
          _CMS_TOKEN: ${{ secrets.CMS_STAGING_API_TOKEN }}
          _S3_BUCKET: ${{ secrets.S3_BUCKET_NAME_STAGING }}
          _CDN_URL: ${{ secrets.CDN_URL_STAGING }}
          _AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          _AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          _BASE_URL: ${{ secrets.NEXT_PUBLIC_STAGING_BASE_URL }}
          _REVALIDATE: ${{ secrets.REVALIDATE_SECRET }}
          _S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          echo "DEPLOYMENT_STATUS=staging" >> $GITHUB_ENV
          echo "S3_REGION=$_S3_REGION" >> $GITHUB_ENV
          echo "CMS_STAGING_API_URL=$_CMS_URL" >> $GITHUB_ENV
          echo "CMS_STAGING_API_TOKEN=$_CMS_TOKEN" >> $GITHUB_ENV
          echo "S3_BUCKET_NAME=$_S3_BUCKET" >> $GITHUB_ENV
          echo "CDN_URL=$_CDN_URL" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=$_AWS_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$_AWS_SECRET" >> $GITHUB_ENV
          echo "BASE_URL=$_BASE_URL" >> $GITHUB_ENV
          echo "REVALIDATE_SECRET=$_REVALIDATE" >> $GITHUB_ENV

      - name: Sync Content to Strapi
        if: steps.check-sync.outputs.skip != 'true'
        env:
          CHANGED_FILES_PATH: .github/outputs/content_changed_files.json
          RESTORE_FILES_PATH: .github/outputs/content_restore_files.json
          DELETED_FILES_PATH: .github/outputs/content_deleted_files.json
          RESTORE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
          CHANGED_ASSETS_PATH: .github/outputs/assets_changed_files.json
          SIDENAV_CHANGED: ${{ steps.changed-sidenav.outputs.any_changed }}
          LISTICLES_CHANGED: ${{ steps.changed-listicles.outputs.any_changed }}
          CHANGED_LISTICLES_PATH: .github/outputs/listicles_changed_files.json
          DELETED_LISTICLES_PATH: .github/outputs/listicles_deleted_files.json
          CMS_BATCH_SIZE: '10'
          CMS_BATCH_DELAY_MS: '1000'
          CMS_MAX_RETRIES: '5'
          CMS_INITIAL_RETRY_DELAY_MS: '1000'
        run: node scripts/sync-content-to-strapi.js

      - name: Trigger Revalidation
        if: steps.check-sync.outputs.skip != 'true' && success()
        run: |
          SIDENAV_FLAG=""
          if [[ "${{ steps.changed-sidenav.outputs.any_changed }}" == "true" ]]; then
            SIDENAV_FLAG="--sidenav-changed"
          fi

          LISTICLES_FLAG=""
          if [[ "${{ steps.changed-listicles.outputs.any_changed }}" == "true" ]]; then
            LISTICLES_FLAG="--listicles-changed"
          fi

          node scripts/revalidate-after-cms-sync.js \
            --changed-files .github/outputs/content_changed_files.json \
            --restore-files .github/outputs/content_restore_files.json \
            --deleted-files .github/outputs/content_deleted_files.json \
            --changed-assets .github/outputs/assets_changed_files.json \
            $SIDENAV_FLAG \
            $LISTICLES_FLAG \
            --changed-listicles .github/outputs/listicles_changed_files.json \
            --deleted-listicles .github/outputs/listicles_deleted_files.json \
            --sync-folders "$SYNC_FOLDERS"

      - name: Update PR Comment
        if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'staging')
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_STATUS: ${{ steps.check-sync.outputs.deployment_status }}
        with:
          script: |
            const script = require('${{ github.workspace }}/scripts/update-pr-comment.js');
            await script({github, context, core});

      - name: Report Status
        if: always()
        run: |
          if [[ "${{ steps.check-sync.outputs.skip }}" == "true" ]]; then
            echo "Sync was skipped."
            if [[ "${{ steps.check-sync.outputs.should_sync }}" != "true" ]]; then
              echo "Reason: PR does not have 'staging' label"
            else
              echo "Reason: No content or asset files changed or deleted"
            fi
          elif [[ "${{ job.status }}" == "success" ]]; then
            echo "Workflow completed successfully!"
          else
            echo "Workflow failed! Check logs above for details."
          fi
