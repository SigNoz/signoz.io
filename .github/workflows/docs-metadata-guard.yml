name: Docs Metadata Guard

on:
  pull_request:
    # labeled/unlabeled/edited so the date skip controls take effect without a push
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    paths:
      - "data/docs/**"
      - "next.config.js"
      - "scripts/check-docs-metadata.js"
      - "scripts/pr-comment-docs-metadata.js"
      - "tests/docs-metadata.test.js"
      - "tests/pr-comment-docs-metadata.test.js"
      - "tests/fixtures/**"
      - "package.json"
      - ".github/workflows/docs-metadata-guard.yml"

permissions:
  contents: read
  pull-requests: write

# One run per PR, so overlapping runs cannot race the sticky comment
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reminder if PR touches components MDX partials
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          touched="$(git diff --name-only "$BASE_SHA" HEAD | grep -E '^components/.*\.mdx$' || true)"
          set -e
          if [ -n "$touched" ]; then
            echo "::notice title=Shared doc components::This PR changes MDX under components/. Prefer React (.tsx) for new shared fragments (wiring in MDXComponents and agent-markdown stubs is simpler). Reviewers: flag newly added .mdx partials here unless there is a strong reason to keep them."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run docs metadata tests
        run: yarn test:docs-metadata

      - name: Validate docs metadata
        id: validate
        env:
          DOCS_METADATA_REPORT: docs-metadata-report.json
          SKIP_DATE_CHECK: ${{ contains(github.event.pull_request.labels.*.name, 'skip-date-check') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: yarn check:docs-metadata

      # Same-repo branches only: a fork PR gets a read-only token, so it reads the log instead
      - name: Comment the result on the pull request
        if: >-
          always() && steps.validate.conclusion != 'skipped' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DOCS_METADATA_REPORT: docs-metadata-report.json
        with:
          script: |
            const script = require('${{ github.workspace }}/scripts/pr-comment-docs-metadata.js');
            await script({github, context, core});
