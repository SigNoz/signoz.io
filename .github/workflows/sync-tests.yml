name: Sync Tests

on:
  pull_request:
    paths:
      - "scripts/cms-sync/**"
      - "scripts/sync-content-to-strapi.js"
      - "scripts/check-cms-assets.js"
      - "tests/sync/**"
      - ".github/workflows/sync-tests.yml"

jobs:
  run-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run sync tests workflow
        run: yarn test:sync
