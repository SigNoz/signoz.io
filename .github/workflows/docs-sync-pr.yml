###############################################################################
# docs-sync-pr.yml — runs in SigNoz/signoz.io
#
# Trigger:  Issue created with label "docs-sync" (by the signoz repo workflow)
# Purpose:  Parse the structured payload from the issue body, search existing
#           docs for affected pages, and create a draft PR with a checklist
#           of what needs updating.
#
# This workflow does NOT auto-write docs content — it creates a well-structured
# PR with all the context needed for a human or AI to write the actual update.
###############################################################################

name: "Create docs PR from sync issue"

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create_docs_pr:
    # Only trigger on issues with the docs-sync label
    if: contains(github.event.issue.labels.*.name, 'docs-sync')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout signoz.io
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parse issue and create PR
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const issueBody = issue.body || '';
            const issueTitle = issue.title || '';

            // ---------------------------------------------------------------
            // 1. Extract JSON payload from the issue body
            // ---------------------------------------------------------------
            let payload = null;
            const jsonMatch = issueBody.match(/```json\n([\s\S]*?)\n```/);
            if (jsonMatch) {
              try {
                payload = JSON.parse(jsonMatch[1]);
              } catch (e) {
                console.log(`Failed to parse JSON payload: ${e.message}`);
              }
            }

            if (!payload) {
              // Comment on the issue that we couldn't parse it
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '⚠️ Could not parse the machine-readable payload from this issue. Manual docs update required.',
              });
              return;
            }

            const { source_pr, analysis, files, screenshots } = payload;

            // ---------------------------------------------------------------
            // 2. Skip if the change isn't user-reachable
            // ---------------------------------------------------------------
            if (analysis.route_check.routed === 'no') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🚫 **Skipping** — the changed code is not routed to users yet.\n\n> ${analysis.route_check.details}\n\nThis issue will stay open. Re-trigger when the feature is enabled.`,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['blocked-not-routed'],
              });
              return;
            }

            if (analysis.feature_flag_check.gated) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🚫 **Skipping** — the feature is behind a feature flag.\n\nFlagged files:\n${analysis.feature_flag_check.flags.map(f => '- `' + f + '`').join('\n')}\n\nThis issue will stay open. Re-trigger when the flag is enabled by default.`,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['blocked-feature-flag'],
              });
              return;
            }

            // ---------------------------------------------------------------
            // 3. Search existing docs for affected pages
            // ---------------------------------------------------------------
            const { execSync } = require('child_process');

            // Map product areas to their likely docs paths
            const docsPathMap = {
              'trace-details':     'data/docs/userguide/span-details.mdx',
              'logs-explorer':     'data/docs/product-features/logs-explorer.mdx',
              'dashboards':        'data/docs/userguide/manage-dashboards.mdx',
              'alerts':            'data/docs/alerts-management/',
              'onboarding':        'data/docs/instrumentation/',
              'infra-monitoring':  'data/docs/infrastructure-monitoring/',
              'settings':          'data/docs/userguide/',
              'traces-explorer':   'data/docs/userguide/traces.mdx',
              'api-monitoring':    'data/docs/product-features/api-monitoring/',
              'metrics-explorer':  'data/docs/product-features/metrics-explorer/',
            };

            // Find which docs files might need updates
            const affectedDocs = [];
            for (const area of analysis.impact_areas) {
              const docsPath = docsPathMap[area];
              if (!docsPath) continue;

              try {
                // Check if the path exists and find matching files
                const result = execSync(
                  `find ${docsPath} -name "*.mdx" 2>/dev/null || echo ""`,
                  { encoding: 'utf8' }
                ).trim();
                if (result) {
                  affectedDocs.push(...result.split('\n').filter(Boolean));
                }
              } catch (e) {
                // Path doesn't exist — that's fine
              }
            }

            // Also search docs content for keywords from the PR title
            const searchTerms = source_pr.title
              .replace(/^feat[\s(/:]*/i, '')
              .replace(/#\d+/g, '')
              .split(/[\s:/-]+/)
              .filter(t => t.length > 3)
              .slice(0, 5);

            const grepResults = [];
            for (const term of searchTerms) {
              try {
                const result = execSync(
                  `grep -rl "${term}" data/docs/ --include="*.mdx" 2>/dev/null | head -5 || true`,
                  { encoding: 'utf8' }
                ).trim();
                if (result) {
                  grepResults.push(...result.split('\n'));
                }
              } catch (e) { /* no matches */ }
            }

            const allDocs = [...new Set([...affectedDocs, ...grepResults])].slice(0, 15);

            // ---------------------------------------------------------------
            // 4. Create a branch
            // ---------------------------------------------------------------
            const branchName = `docs-sync/pr-${source_pr.number}`;
            const baseBranch = 'main';

            // Get the SHA of the base branch
            const baseRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`,
            });

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branchName}`,
                sha: baseRef.data.object.sha,
              });
            } catch (e) {
              if (e.status === 422) {
                console.log('Branch already exists — skipping creation.');
              } else {
                throw e;
              }
            }

            // ---------------------------------------------------------------
            // 5. Create a placeholder commit (checklist file)
            // ---------------------------------------------------------------
            const checklistContent = `# Docs Update Checklist

Source: [${source_pr.title}](${source_pr.url}) (#${source_pr.number})

## Impact
- **Type:** ${analysis.impact_type}
- **Areas:** ${analysis.impact_areas.join(', ')}
- **UI Changes:** ${analysis.has_ui_changes ? 'Yes' : 'No'}

## Docs Files to Review
${allDocs.map(f => `- [ ] \`${f}\``).join('\n') || '- [ ] _No existing docs found — new page may be needed_'}

## Screenshots
${screenshots.needed
  ? screenshots.hints.map(h => `- [ ] **${h.area}** — go to \`${h.url}\``).join('\n')
  : '- No screenshots needed'}

## Changed Source Files (for reference)
${(files.frontend_pages || []).slice(0, 10).map(f => `- \`${f}\``).join('\n')}
${(files.frontend_containers || []).slice(0, 10).map(f => `- \`${f}\``).join('\n')}
${(files.backend || []).slice(0, 10).map(f => `- \`${f}\``).join('\n')}
`;

            // Create the file via the Git API
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: `.docs-sync/pr-${source_pr.number}-checklist.md`,
              message: `docs-sync: add checklist for ${source_pr.title} (#${source_pr.number})`,
              content: Buffer.from(checklistContent).toString('base64'),
              branch: branchName,
            });

            // ---------------------------------------------------------------
            // 6. Create a draft PR
            // ---------------------------------------------------------------
            const prBody = `## Docs Update for [${source_pr.title}](${source_pr.url})

> Auto-created from SigNoz/signoz#${source_pr.number}

### What changed in the product
- **Impact type:** \`${analysis.impact_type}\`
- **Product area:** ${analysis.impact_areas.map(a => '`' + a + '`').join(', ')}
- **UI changes:** ${analysis.has_ui_changes ? 'Yes — screenshots needed' : 'No'}

### Docs files likely affected
${allDocs.map(f => `- [ ] [\`${f}\`](${f})`).join('\n') || '_No matches found — may need a new docs page._'}

### Screenshots to capture
${screenshots.needed
  ? screenshots.hints.map(h => `- [ ] **${h.area}** — navigate to \`${h.url}\` and capture the updated UI`).join('\n')
  : '_No screenshots needed._'}

### Source PR context
<details>
<summary>PR description</summary>

${issueBody.split('### What Changed')[1]?.split('###')[0]?.trim() || '_See source PR._'}

</details>

<details>
<summary>Changed files (${files.total} total)</summary>

**Frontend pages:** ${(files.frontend_pages || []).map(f => '`' + f + '`').join(', ') || '—'}

**Frontend containers:** ${(files.frontend_containers || []).map(f => '`' + f + '`').join(', ') || '—'}

**Backend:** ${(files.backend || []).slice(0, 10).map(f => '`' + f + '`').join(', ') || '—'}

**Routes:** ${(files.routes || []).map(f => '`' + f + '`').join(', ') || '—'}

</details>

### How to complete this PR
1. Review the checklist in \`.docs-sync/pr-${source_pr.number}-checklist.md\`
2. Update the affected docs files listed above
3. Add screenshots if UI changed
4. Delete the checklist file
5. Mark as ready for review

Closes #${issueNumber}

---
_Auto-generated by [docs-sync-pr](https://github.com/SigNoz/signoz.io/blob/main/.github/workflows/docs-sync-pr.yml)_
`;

            const newPr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[docs-sync] ${source_pr.title}`,
              body: prBody,
              head: branchName,
              base: baseBranch,
              draft: true,
            });

            console.log(`Created draft PR: ${newPr.data.html_url}`);

            // ---------------------------------------------------------------
            // 7. Comment back on the issue with the PR link
            // ---------------------------------------------------------------
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ Draft PR created: ${newPr.data.html_url}\n\n**Next steps:**\n1. Review the checklist and affected docs\n2. Update docs content\n3. Add screenshots if needed\n4. Mark PR as ready for review`,
            });

            // Add "pr-created" label to the issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['pr-created'],
            });
